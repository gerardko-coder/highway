name: Fetch LTA Traffic Data

on:
  schedule:
    # Runs every 20 minutes between 6:00 AM and 11:00 PM SGT (22:00 to 15:00 UTC)
    - cron: '*/20 22-23,0-15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write # Grants write access for automatic commits

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Always checkout the latest commit on main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and Merge All LTA DataMall Pages
        run: |
          node -e '
          const fs = require("fs");

          const API_KEY = process.env.LTA_KEY;
          const BASE_URL = "https://datamall2.mytransport.sg/ltaodataservice/v4/TrafficSpeedBands";

          async function fetchWithRetry(url, retries = 3, delayMs = 2000) {
            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    "AccountKey": API_KEY,
                    "accept": "application/json",
                    "User-Agent": "Mozilla/5.0"
                  }
                });

                if (response.ok) {
                  return await response.json();
                }

                console.warn(`Attempt ${attempt} failed with status ${response.status}. Retrying...`);
              } catch (err) {
                console.warn(`Attempt ${attempt} network error: ${err.message}. Retrying...`);
              }

              if (attempt < retries) {
                await new Promise(res => setTimeout(res, delayMs));
              }
            }
            throw new Error(`Failed to fetch ${url} after ${retries} attempts.`);
          }

          async function fetchAllData() {
            if (!API_KEY) {
              throw new Error("LTA_KEY secret is missing or empty!");
            }

            let allValues = [];
            let skip = 0;
            let keepFetching = true;
            let lastUpdatedTime = "";

            console.log("Starting resilient fetch from LTA DataMall...");

            while (keepFetching) {
              const url = `${BASE_URL}?$skip=${skip}`;
              console.log(`Fetching page with skip = ${skip}...`);

              const data = await fetchWithRetry(url);
              const records = data.value || [];

              if (data.lastUpdatedTime) {
                lastUpdatedTime = data.lastUpdatedTime;
              }

              allValues = allValues.concat(records);
              console.log(`Retrieved ${records.length} records. Total so far: ${allValues.length}`);

              if (records.length < 500) {
                keepFetching = false;
              } else {
                skip += 500;
              }
            }

            const outputData = {
              "odata.metadata": `${BASE_URL}/$metadata#TrafficSpeedBands`,
              "lastUpdatedTime": lastUpdatedTime || new Date().toISOString(),
              "value": allValues
            };

            fs.writeFileSync("traffic.json", JSON.stringify(outputData, null, 2));
            console.log(`Successfully saved ${allValues.length} total road links to traffic.json`);
          }

          fetchAllData().catch(err => {
            console.error("Fatal Error fetching data:", err);
            process.exit(1);
          });
          '
        env:
          LTA_KEY: ${{ secrets.LTA_KEY }}

      - name: Auto Commit Traffic Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update traffic data [skip ci]"
          file_pattern: "traffic.json"
          skip_fetch: false