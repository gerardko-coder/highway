name: Fetch LTA Traffic Data

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Enables manual trigger button in GitHub Actions UI

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch DataMall API
        run: |
          curl -s -H "AccountKey: ${{ secrets.LTA_KEY }}" \
               -H "accept: application/json" \
               "https://datamall2.mytransport.sg/ltaodataservice/v4/TrafficSpeedBands" \
               -o traffic.json

      - name: Commit and Push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update traffic data [skip ci]" && git push)
