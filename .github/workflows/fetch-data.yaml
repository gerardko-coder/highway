name: Fetch LTA Traffic Data

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Merge All LTA DataMall Pages
        run: |
          node -e '
          const fs = require("fs");

          const API_KEY = process.env.LTA_KEY;
          const BASE_URL = "https://datamall2.mytransport.sg/ltaodataservice/v4/TrafficSpeedBands";

          async function fetchAllData() {
            let allValues = [];
            let skip = 0;
            let keepFetching = true;
            let lastUpdatedTime = "";

            console.log("Starting full fetch from LTA DataMall...");

            while (keepFetching) {
              const url = `${BASE_URL}?$skip=${skip}`;
              console.log(`Fetching page with skip = ${skip}...`);

              const response = await fetch(url, {
                headers: {
                  "AccountKey": API_KEY,
                  "accept": "application/json",
                  "User-Agent": "Mozilla/5.0"
                }
              });

              if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
              }

              const data = await response.json();
              const records = data.value || [];

              if (data.lastUpdatedTime) {
                lastUpdatedTime = data.lastUpdatedTime;
              }

              allValues = allValues.concat(records);
              console.log(`Retrieved ${records.length} records. Total so far: ${allValues.length}`);

              // LTA limits each page to 500 items. If less than 500 returned, we hit the end.
              if (records.length < 500) {
                keepFetching = false;
              } else {
                skip += 500;
              }
            }

            const outputData = {
              "odata.metadata": `${BASE_URL}/$metadata#TrafficSpeedBands`,
              "lastUpdatedTime": lastUpdatedTime || new Date().toISOString(),
              "value": allValues
            };

            fs.writeFileSync("traffic.json", JSON.stringify(outputData, null, 2));
            console.log(`Successfully saved ${allValues.length} total road links to traffic.json`);
          }

          fetchAllData().catch(err => {
            console.error("Error fetching data:", err);
            process.exit(1);
          });
          '
        env:
          LTA_KEY: ${{ secrets.LTA_KEY }}

      - name: Commit and Push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update traffic data [skip ci]" && git push)