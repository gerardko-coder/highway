<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SG Live Expressway Speeds</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .badge-1 { background-color: #ef4444; color: white; } /* < 20 km/h */
    .badge-2 { background-color: #f97316; color: white; } /* 20-29 km/h */
    .badge-3 { background-color: #eab308; color: black; } /* 30-39 km/h */
    .badge-4 { background-color: #84cc16; color: black; } /* 40-49 km/h */
    .badge-5 { background-color: #22c55e; color: white; } /* 50-59 km/h */
    .badge-6 { background-color: #10b981; color: white; } /* 60-69 km/h */
    .badge-7 { background-color: #06b6d4; color: white; } /* 70-79 km/h */
    .badge-8 { background-color: #3b82f6; color: white; } /* >= 80 km/h */
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-wide">Live Expressways</h1>
    </div>
    <button onclick="fetchLiveApiData()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
      <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      Refresh Live
    </button>
  </header>

  <!-- Filter & Search -->
  <section class="p-4 bg-slate-800/50 border-b border-slate-700/50 space-y-3">
    <input type="text" id="searchInput" oninput="renderData()" placeholder="Search road or location..." 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

    <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs" id="expresswayChips">
      <button onclick="filterExpressway('ALL')" class="chip px-3 py-1 rounded-full bg-indigo-600 text-white font-medium whitespace-nowrap">All</button>
      <button onclick="filterExpressway('PIE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">PIE</button>
      <button onclick="filterExpressway('AYE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">AYE</button>
      <button onclick="filterExpressway('CTE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">CTE</button>
      <button onclick="filterExpressway('ECP')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">ECP</button>
      <button onclick="filterExpressway('KPE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">KPE</button>
      <button onclick="filterExpressway('SLE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">SLE</button>
      <button onclick="filterExpressway('TPE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">TPE</button>
      <button onclick="filterExpressway('BKE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">BKE</button>
      <button onclick="filterExpressway('MCE')" class="chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap">MCE</button>
    </div>
  </section>

  <!-- Content -->
  <main class="flex-1 p-4 overflow-y-auto">
    <div id="statusBanner" class="mb-4 text-xs text-slate-400 bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center">
      <span id="statusText">Connecting to Live LTA API...</span>
      <span id="recordCount" class="font-mono text-indigo-400">0 segments</span>
    </div>

    <div id="trafficList" class="space-y-2.5"></div>
  </main>

  <script>
    // Live LTA Endpoint & API Key
    const API_KEY = "mlfDLYgcQGS+KM8/azN30Q==";
    const LIVE_API_URL = "http://datamall2.lta.gov.sg/ltaodataservice/TrafficSpeedBands";
    const CORS_PROXY = "https://corsproxy.io/?";

    let rawData = [];
    let selectedExpressway = 'ALL';

    const speedBandMap = {
      1: { label: "< 20 km/h", class: "badge-1" },
      2: { label: "20 - 29 km/h", class: "badge-2" },
      3: { label: "30 - 39 km/h", class: "badge-3" },
      4: { label: "40 - 49 km/h", class: "badge-4" },
      5: { label: "50 - 59 km/h", class: "badge-5" },
      6: { label: "60 - 69 km/h", class: "badge-6" },
      7: { label: "70 - 79 km/h", class: "badge-7" },
      8: { label: ">= 80 km/h", class: "badge-8" }
    };

    window.addEventListener('DOMContentLoaded', fetchLiveApiData);

    async function fetchLiveApiData() {
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      const refreshIcon = document.getElementById('refreshIcon');

      statusText.innerText = "Querying Live LTA API...";
      statusDot.className = "w-3 h-3 rounded-full bg-amber-500 animate-pulse";
      refreshIcon.classList.add('animate-spin');

      try {
        // Target live API through HTTPS proxy with AccountKey header
        const proxiedUrl = CORS_PROXY + encodeURIComponent(LIVE_API_URL);
        
        const response = await fetch(proxiedUrl, {
          method: 'GET',
          headers: {
            'AccountKey': API_KEY,
            'accept': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`API error: ${response.status} ${response.statusText}`);

        const json = await response.json();
        rawData = json.value || [];

        statusText.innerText = "Live API Sync: " + new Date().toLocaleTimeString();
        statusDot.className = "w-3 h-3 rounded-full bg-emerald-500";
        renderData();

      } catch (err) {
        console.error("Live API Fetch Error:", err);
        statusText.innerText = "Error calling Live API: " + err.message;
        statusDot.className = "w-3 h-3 rounded-full bg-red-500";
      } finally {
        refreshIcon.classList.remove('animate-spin');
      }
    }

    function filterExpressway(code) {
      selectedExpressway = code;
      document.querySelectorAll('.chip').forEach(chip => {
        if (chip.innerText === code || (code === 'ALL' && chip.innerText === 'All')) {
          chip.className = "chip px-3 py-1 rounded-full bg-indigo-600 text-white font-medium whitespace-nowrap";
        } else {
          chip.className = "chip px-3 py-1 rounded-full bg-slate-700 text-slate-300 whitespace-nowrap";
        }
      });
      renderData();
    }

    function renderData() {
      const container = document.getElementById('trafficList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      let filtered = rawData.filter(item => {
        const roadName = (item.RoadName || '').toUpperCase();
        const matchesChip = (selectedExpressway === 'ALL') || roadName.includes(selectedExpressway);
        const matchesSearch = !searchVal || roadName.toLowerCase().includes(searchVal) || (item.Location || '').toLowerCase().includes(searchVal);
        return matchesChip && matchesSearch;
      });

      document.getElementById('recordCount').innerText = `${filtered.length} segments`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-500">No matching live road segments found.</div>`;
        return;
      }

      filtered.forEach(item => {
        const band = speedBandMap[item.SpeedBand] || { label: "Band " + item.SpeedBand, class: "bg-slate-600 text-white" };
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 rounded-xl p-3 shadow-sm flex items-center justify-between";
        card.innerHTML = `
          <div class="space-y-1">
            <div class="font-bold text-sm text-slate-100">${item.RoadName || 'Road Segment'}</div>
            <div class="text-xs text-slate-400">
              ${item.MinSpeed && item.MaxSpeed ? `Speed: ${item.MinSpeed} - ${item.MaxSpeed} km/h` : `Link ID: ${item.LinkID || 'N/A'}`}
            </div>
          </div>
          <div>
            <span class="${band.class} px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm whitespace-nowrap">
              ${band.label}
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
