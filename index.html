<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nearby Road Speeds (5km Radius)</title>
    
    <!-- Leaflet CSS for Map rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --accent-blue: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .btn-icon {
            background-color: #334155;
        }

        .btn-icon:hover {
            background-color: #475569;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            background-color: #334155;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* Desktop Sidebar */
        .sidebar {
            width: 360px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .filter-bar {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .filter-info {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .filter-bar select {
            width: 100%;
            padding: 0.5rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.85rem;
            outline: none;
        }

        .expressway-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .expressway-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .expressway-card:hover {
            border-color: var(--accent-blue);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .speed-badge {
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .speed-smooth { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .speed-moderate { background-color: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }
        .speed-slow { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .card-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1000;
            font-size: 0.75rem;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        /* Pulsing User Location Marker */
        .user-location-marker {
            width: 18px;
            height: 18px;
            background-color: #38bdf8;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Mobile Responsive Drawer */
        @media (max-width: 768px) {
            header {
                padding: 0.5rem 0.75rem;
            }

            .header-title h1 {
                font-size: 0.95rem;
            }

            .header-title p {
                display: none;
            }

            .main-container {
                flex-direction: column;
            }

            #map {
                height: 100%;
                width: 100%;
            }

            .sidebar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: 45vh;
                max-height: 80vh;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-top-left-radius: 1rem;
                border-top-right-radius: 1rem;
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
                transform: translateY(calc(100% - 50px));
            }

            .sidebar.expanded {
                transform: translateY(0);
            }

            .drawer-handle {
                width: 100%;
                padding: 0.5rem;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                background-color: var(--card-bg);
                border-top-left-radius: 1rem;
                border-top-right-radius: 1rem;
            }

            .drawer-bar {
                width: 36px;
                height: 4px;
                background-color: var(--text-muted);
                border-radius: 2px;
            }

            .legend {
                bottom: 60px;
                left: 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Nearby Traffic Speeds</h1>
            <p>LTA Speed Bands &bull; 5km Vicinity</p>
        </div>
        <div class="controls">
            <span id="lastUpdated" class="status-badge">Updated: Never</span>
            <button id="locateBtn" class="btn-icon" title="Find My Location">
                📍 <span class="btn-text">Recenter (5km)</span>
            </button>
            <button id="refreshBtn">🔄 Refresh</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>

        <div class="sidebar" id="sidebar">
            <div class="drawer-handle" id="drawerHandle">
                <div class="drawer-bar"></div>
            </div>
            <div class="filter-bar">
                <div id="filterInfo" class="filter-info">Showing roads within 5km...</div>
                <select id="roadFilter">
                    <option value="ALL">All Nearby Roads</option>
                </select>
            </div>
            <div id="expresswayList" class="expressway-list">
                <!-- Dynamic Content Inserted Here -->
            </div>
        </div>
    </div>

    <div class="legend">
        <strong style="display:block; margin-bottom:4px;">Speed Bands</strong>
        <div class="legend-item"><div class="legend-color" style="background: var(--accent-green)"></div> &ge; 40 km/h (Smooth)</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--accent-yellow)"></div> 20 - 39 km/h (Moderate)</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--accent-red)"></div> &lt; 20 km/h (Congested)</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const DATA_URL = "./traffic.json";
        const RADIUS_KM = 5.0; // Radius filter threshold in kilometers

        // Default Singapore Center (Used if user denies GPS location permission)
        const DEFAULT_LOCATION = { lat: 1.3521, lng: 103.8198 };

        let map;
        let polylineGroup;
        let userCircle;
        let userMarker;
        let currentUserPos = null;
        let trafficData = [];

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchTrafficData();

            document.getElementById('refreshBtn').addEventListener('click', fetchTrafficData);
            document.getElementById('locateBtn').addEventListener('click', getUserLocation);
            document.getElementById('roadFilter').addEventListener('change', renderData);
            
            // Mobile Drawer handle listener
            document.getElementById('drawerHandle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('expanded');
            });

            setInterval(fetchTrafficData, 120000);
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lng], 13);

            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 18
            }).addTo(map);

            polylineGroup = L.layerGroup().addTo(map);
        }

        // Haversine formula to compute distance between two GPS coordinates in kilometers
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getUserLocation() {
            if (!navigator.geolocation) {
                console.warn("Geolocation not supported. Defaulting to Central Singapore.");
                currentUserPos = DEFAULT_LOCATION;
                updateUserMapLocation();
                renderData();
                return;
            }

            const locateBtn = document.getElementById('locateBtn');
            locateBtn.textContent = 'Locating...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentUserPos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    updateUserMapLocation();
                    renderData();

                    locateBtn.innerHTML = '📍 <span class="btn-text">Recenter (5km)</span>';
                },
                (error) => {
                    console.warn("Location access denied or failed. Using default location.", error);
                    currentUserPos = DEFAULT_LOCATION;
                    updateUserMapLocation();
                    renderData();
                    locateBtn.innerHTML = '📍 <span class="btn-text">Recenter (5km)</span>';
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function updateUserMapLocation() {
            if (!currentUserPos) return;

            // Remove existing user indicators
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);

            // Draw 5km radius visual circle around user
            userCircle = L.circle([currentUserPos.lat, currentUserPos.lng], {
                radius: RADIUS_KM * 1000,
                color: '#0284c7',
                fillColor: '#0284c7',
                fillOpacity: 0.05,
                weight: 1.5,
                dashArray: '4, 4'
            }).addTo(map);

            // Draw pulsing user marker
            const userIcon = L.divIcon({
                className: 'user-location-marker',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });

            userMarker = L.marker([currentUserPos.lat, currentUserPos.lng], { icon: userIcon }).addTo(map);
            userMarker.bindPopup("<strong>You are here</strong>");

            // Fly map to user location
            map.flyTo([currentUserPos.lat, currentUserPos.lng], 13);
        }

        async function fetchTrafficData() {
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.textContent = 'Loading...';
                refreshBtn.disabled = true;
            }

            try {
                const response = await fetch(`${DATA_URL}?_t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const data = await response.json();
                trafficData = data.value || [];
                
                document.getElementById('lastUpdated').textContent = data.lastUpdatedTime ? 
                    `LTA: ${data.lastUpdatedTime.split(' ')[1] || data.lastUpdatedTime}` : 
                    `Updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

                if (!currentUserPos) {
                    getUserLocation();
                } else {
                    renderData();
                }
            } catch (err) {
                console.error("Failed to load traffic data:", err);
                alert("Could not load traffic.json file.");
            } finally {
                if (refreshBtn) {
                    refreshBtn.textContent = '🔄 Refresh';
                    refreshBtn.disabled = false;
                }
            }
        }

        function populateRoadFilter(nearbyItems) {
            const filterSelect = document.getElementById('roadFilter');
            const selectedVal = filterSelect.value;
            filterSelect.innerHTML = '<option value="ALL">All Nearby Roads</option>';

            const uniqueRoads = [...new Set(nearbyItems.map(item => item.RoadName).filter(Boolean))].sort();
            uniqueRoads.forEach(road => {
                const opt = document.createElement('option');
                opt.value = road;
                opt.textContent = road;
                filterSelect.appendChild(opt);
            });

            if (uniqueRoads.includes(selectedVal)) {
                filterSelect.value = selectedVal;
            }
        }

        function getColorBySpeed(minSpeed, maxSpeed) {
            const avgSpeed = (parseFloat(minSpeed) + parseFloat(maxSpeed)) / 2;
            if (avgSpeed >= 40) return '#22c55e';
            if (avgSpeed >= 20) return '#eab308';
            return '#ef4444';
        }

        function getSpeedClass(minSpeed, maxSpeed) {
            const avgSpeed = (parseFloat(minSpeed) + parseFloat(maxSpeed)) / 2;
            if (avgSpeed >= 40) return 'speed-smooth';
            if (avgSpeed >= 20) return 'speed-moderate';
            return 'speed-slow';
        }

        function renderData() {
            polylineGroup.clearLayers();
            const listContainer = document.getElementById('expresswayList');
            listContainer.innerHTML = '';

            if (!currentUserPos) return;

            // Step 1: Filter full dataset to segments within 5km radius of user
            const nearbyItems = trafficData.filter(item => {
                const startLat = parseFloat(item.StartLat);
                const startLng = parseFloat(item.StartLon);

                if (isNaN(startLat) || isNaN(startLng)) return false;

                const distanceKm = calculateDistanceKm(
                    currentUserPos.lat, currentUserPos.lng,
                    startLat, startLng
                );

                return distanceKm <= RADIUS_KM;
            });

            populateRoadFilter(nearbyItems);

            const selectedFilter = document.getElementById('roadFilter').value;

            // Step 2: Apply dropdown selection filter
            const filteredData = nearbyItems.filter(item => {
                if (selectedFilter !== 'ALL') {
                    return item.RoadName === selectedFilter;
                }
                return true;
            });

            document.getElementById('filterInfo').textContent = 
                `Found ${nearbyItems.length} segments within 5km radius`;

            if (filteredData.length === 0) {
                listContainer.innerHTML = `<div style="padding: 1rem; color: var(--text-muted);">No road segments found within 5km.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const startLat = parseFloat(item.StartLat);
                const startLng = parseFloat(item.StartLon);
                const endLat = parseFloat(item.EndLat);
                const endLng = parseFloat(item.EndLon);

                const minSpeed = item.MinimumSpeed || '0';
                const maxSpeed = item.MaximumSpeed || '0';

                const color = getColorBySpeed(minSpeed, maxSpeed);
                const speedClass = getSpeedClass(minSpeed, maxSpeed);

                if (!isNaN(startLat) && !isNaN(startLng) && !isNaN(endLat) && !isNaN(endLng)) {
                    const polyline = L.polyline([[startLat, startLng], [endLat, endLng]], {
                        color: color,
                        weight: 5,
                        opacity: 0.85
                    });

                    polyline.bindPopup(`
                        <strong>${item.RoadName}</strong><br/>
                        Speed: ${minSpeed} - ${maxSpeed} km/h<br/>
                        Speed Band: ${item.SpeedBand}
                    `);

                    polylineGroup.addLayer(polyline);
                }

                const card = document.createElement('div');
                card.className = 'expressway-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${item.RoadName}</span>
                        <span class="speed-badge ${speedClass}">${minSpeed}-${maxSpeed} km/h</span>
                    </div>
                    <div class="card-metrics">
                        <span>Speed Band: ${item.SpeedBand}</span>
                        <span>Link ID: ${item.LinkID}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (!isNaN(startLat) && !isNaN(startLng)) {
                        map.flyTo([startLat, startLng], 16);
                        if (window.innerWidth <= 768) {
                            document.getElementById('sidebar').classList.remove('expanded');
                        }
                    }
                });

                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
